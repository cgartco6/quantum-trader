[package]
name = "quantum-desktop"
version = "0.1.0"
description = "Quantum Trader Native Desktop Terminal"
authors = ["Quantum Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
