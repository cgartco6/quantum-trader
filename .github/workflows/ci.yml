name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ---------------------------------------------------------------------------
  # Python Engine & Bot Unit / Integration Tests
  # ---------------------------------------------------------------------------
  test-python-services:
    name: Test Python Engine & Telegram Bot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f services/engine/requirements.txt ]; then pip install -r services/engine/requirements.txt; fi

      - name: Lint Python Codebase
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 services/engine services/telegram-bot --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 services/engine services/telegram-bot --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Engine Tests with Coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/engine/tests --cov=services/engine/src --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Frontend & App Ecosystem Tests (Next.js, Web, Shared UI)
  # ---------------------------------------------------------------------------
  test-frontend-apps:
    name: Test Web Dashboard & Shared Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Type Check & Lint Web Application
        run: |
          npm run lint --workspace=apps/web
          npm run type-check --workspace=apps/web || true

      - name: Build Web Frontend
        run: npm run build --workspace=apps/web
