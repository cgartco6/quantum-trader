name: Engine CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/engine/**'
      - '.github/workflows/CI-engine-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/engine/**'

jobs:
  test-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/engine/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest services/engine/tests -v --cov=services/engine/src
