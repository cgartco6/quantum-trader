version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database & Caching Layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: qt-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantum_trader}
      POSTGRES_USER: ${POSTGRES_USER:-qt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qt_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qt_admin} -d ${POSTGRES_DB:-quantum_trader}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qt-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Core Services
  # ---------------------------------------------------------------------------
  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    container_name: qt-trading-engine
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qt_admin}:${POSTGRES_PASSWORD:-qt_secure_password_2026}@postgres:5432/${POSTGRES_DB:-quantum_trader}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: qt-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qt_admin}:${POSTGRES_PASSWORD:-qt_secure_password_2026}@postgres:5432/${POSTGRES_DB:-quantum_trader}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
    container_name: qt-telegram-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_GATEWAY_URL=http://api-gateway:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      api-gateway:
        condition: service_started
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Web Portal
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: qt-web-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
